{% extends "posts/base.html" %}

{% block title %}Eliminar post | Mi Blog{% endblock %}

{% block content %}
    <h2>Eliminar post</h2>
    <p>¿Seguro que querés eliminar "{{ post.titulo }}"? Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'detalle_post' post.slug %}">Cancelar</a>
    </form>
{% endblock %}
